<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="stylesheet" href="/styles/clear-list.css">
</head>

<body>
  <div class="products">
    <h1 class="products__title" id="store">
      Выбери свой продукт
    </h1>

    <button id="toggleButtonColor" class="button__blue">Нажми на кнопку</button>
    <button id="changeFirstCard">поменять цвет карточки</button>
    <button id="changeAllCards">поменять цвет карточек</button>
    <button id="openGoogle">Открыть гугл</button>
    <button id="showConsoleLog">Вывести в консоль</button>

    <div class="products__list" id="productCards__list"></div>

    <template id="productCard-template">
      <article class="product">
        <img class="product__image" src="" alt="" />
        <p class="product__skin-type"></p>
        <h2 class="product__name"></h2>
        <p class="product__description"></p>
        <p class="product__compound-title">Состав</p>
        <ul class="product__ingredients"></ul>
        <div class="product__price">
          <span class="product__price-label">Цена:</span>
          <span class="product__price-value"></span>
        </div>
      </article>
    </template>
  </div>

  <footer class="footer" id="contacts">
    <div class="footer__container">
      <div class="footer__columns">
        <div class="footer__column footer__column_left">
          <h2 class="footer__title">Product Cards</h2><!-- /.footer__title -->
          <p class="footer__text">У нас самые лучшие продукты для кожи!</p><!-- /.footer__text -->
          <div class="footer__socials">
            <a href="#" class="footer__social-link">
              <img src="/images/telegram_icon.svg" alt="Telegram" class="footer__social-icon">
            </a>
            <a href="#" class="footer__social-link">
              <img src="/images/vk_icon.svg" alt="VK" class="footer__social-icon">
            </a>
          </div>
        </div><!-- /.footer__column footer__column_left -->
        <div class="footer__column footer__column_centre">
          <p class="footer__form-title">Подпишись на наши акции:</p><!-- /.footer__form-title -->
          <form action="#" class="footer__form">
            <input type="email" name="email" class="footer__form-input" placeholder="Введи Email...">
            <button type="submit" class="footer__form-button"> <span class="footer__form-divider"></span>
              Подписаться</button>
          </form><!-- /.footer__form -->
        </div><!-- /.footer__column footer__column_centre -->
        <div class="footer__column footer__column_right">
          <p class="footer__links-title">
            Быстрые ссылки
          </p><!-- /.footer__links-title -->
          <nav class="links">
            <ul class="links__list">
              <li class="links__item"><a href="#">Главная</a></li><!-- /.links__item -->
              <li class="links__item"><a href="#store">Магазин</a></li><!-- /.links__item -->
              <li class="links__item"><a href="#contacts">Контакты</a></li><!-- /.links__item -->
            </ul><!-- /.links__list-->

          </nav><!-- /.links -->
        </div><!-- /.footer__column footer__column_right -->
      </div><!-- /.footer__columns -->

      <p class="footer__copyright">www.product-cards.com©all right reserve</p><!-- /.footer__copyright -->
    </div><!-- /.footer__container -->

  </footer><!-- /.footer -->


  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
</body>

</html>
