<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="main">
    <div class="container">
      <h1 class="title">Выбери свой продукт</h1><!-- /.title -->

      <ul class="products">
        <li class="products_item card">
          <img src="images/soothing_mousse.png" alt="Увлажняющий мусс" class="card_img">
          <span class="card_category">для нормальной кожи</span><!-- /.card_category -->
          <h2 class="card_name">Увлажняющий мусс</h2><!-- /.card_name -->
          <p class="card_description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p><!-- /.card_description -->

          <div class="card_compound compound">
            <span class="compound_name">Состав</span><!-- /.compound_name -->
            <ul class="compound_list">
              <li>активные натуральные комплексы</li>
              <li>витамины С, А, РР, В И Е</li>
              <li>солнцезащитные компоненты</li>
            </ul><!-- /.compound_list -->
          </div><!-- /.card_compound compound-->

          <div class="card_price">
            <b>Цена</b>
            <span>2 750 &#8381;</span>
          </div><!-- /.card_price -->
        </li><!-- /.products_item card-->
      </ul><!-- /.products -->
    </div><!-- /.container -->
  </main><!-- /.main -->


</body>




</html>
