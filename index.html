<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="stylesheet" href="/styles/clear-list.css">
</head>

<body>
  <div class="products">
    <h1 class="products__title">
      Выбери свой продукт
    </h1>

    <button id="toggleButtonColor" class="button__blue">Нажми на кнопку</button>
    <button id="changeFirstCard">поменять цвет карточки</button>
    <button id="changeAllCards">поменять цвет карточек</button>
    <button id="openGoogle">Открыть гугл</button>
    <button id="showConsoleLog">Вывести в консоль</button>

    <div class="products__list" id="productCards__list"></div>

    <template id="productCard-template">
      <article class="product">
        <img class="product__image" src="" alt="" />
        <p class="product__skin-type"></p>
        <h2 class="product__name"></h2>
        <p class="product__description"></p>
        <p class="product__compound-title">Состав</p>
        <ul class="product__ingredients"></ul>
        <div class="product__price">
          <span class="product__price-label">Цена:</span>
          <span class="product__price-value"></span>
        </div>
      </article>
    </template>
  </div>

  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
</body>

</html>
